apiVersion: apps/v1
kind: Deployment
metadata:
  name: amn-frontend
spec:
  selector:
    matchLabels:
      app: amn-frontend
  replicas: 2 # tells deployment to run 2 pods matching the template
  template:
    metadata:
      labels:
        app: amn-frontend
    spec:
      containers:
      - name: amn-frontend
        image: amn-frontend:0.1.0
        ports:
        - containerPort: 3000