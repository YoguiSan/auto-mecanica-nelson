services:
  # Channel API (FastAPI Python)
  channel-api:
    build:
      context: ./packages/chatbot-channel-backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"  # Channel API
    # environment:
    #   - REDIS_URL=redis://redis:6379
    #   - GEMINI_API_KEY=${GEMINI_API_KEY}
    #   - OLLAMA_URL=http://ollama:11434
    # depends_on:
    #   - redis
    #   - ollama  # Optional local fallback
    # networks:
    #  - backend-net
    restart: unless-stopped

  # System API (Express Node.js)
  system-api:
    build:
      context: ./packages/chatbot-system-backend
      dockerfile: Dockerfile
    ports:
      - "4000:4000"  # System API
    environment:
      - PORT = 4000
      - ENVIRONMENT=${ENVIRONMENT:-development}  # Fallback
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    #   - REDIS_URL=redis://redis:6379
    #   - CHANNEL_URL=http://channel-api:8000
    #   - DATABASE_URL=postgresql://postgres:password@db:5432/chatbot
    # depends_on:
    #   - redis
    #   - db
    # networks:
    #   - backend-net
    restart: unless-stopped

