version: 2.1

orbs:
  node: circleci/node@5.2

jobs:
  test:
    executor:
      name: node/default
      tag: '16.10'
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-dependencies-{{ checksum "package-lock.json" }}
            - v1-dependencies-
      - node/install-packages:
          pkg-manager: npm ci
      - run:
          name: Install ts-node
          command: npm ci -D ts-node
      - save_cache:
          paths:
            - node_modules
          key: v1-dependencies-{{ checksum "package-lock.json" }}
      - run:
          name: Run tests
          command: npm test

  deploy_surge:
    executor:
      name: node/default
      tag: '16.10'
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm
      - run:
          name: Build app
          command: |
            npm run build
      - run:
          name: Install Surge
          command: npm install -g surge
      - run:
          name: Deploy to Surge
          command: surge ./out auto-mecanica-nelson.surge.sh

workflows:
  test:
    jobs:
      - test:
          filters:
            branches:
              only:
                - develop
                - master
  test_and_deploy:
    jobs:
      # - test
      - deploy_surge:
          # requires:
          #   - test
          filters:
            branches:
              only:
                - master