apiVersion: apps/v1
kind: Deployment
metadata:
  name: amn-chatbot-system-backend
spec:
  selector:
    matchLabels:
      app: amn-chatbot-system-backend
  replicas: 2
  template:
    metadata:
      labels:
        app: amn-chatbot-system-backend
    spec:
      containers:
      - name: amn-chatbot-system
        image: localhost/amn-chatbot-system:0.1.0
        imagePullPolicy: Never
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        ports:
          - containerPort: 4000