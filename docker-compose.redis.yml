services:
  # Logical database 0 is reserved for chatbot backends; database 1 is for vehicle search.
  redis:
    build:
      context: .
      dockerfile: Dockerfile.redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in the root .env}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - backend-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redis_data:

networks:
  backend-net:
    driver: bridge
